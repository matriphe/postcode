name: Go CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./...

      - name: Test package version rules
        run: bash ci/next-version_test.sh

      - name: Build package
        run: go build ./...

  docker-smoke:
    name: BusyBox smoke test
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build BusyBox smoke image
        run: docker build --pull -f ci/go/Dockerfile -t postcode-ci .

      - name: Run golden cases in BusyBox
        run: docker run --rm postcode-ci

  version:
    name: Tag package version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted == false
    needs:
      - unit-tests
      - docker-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: package-version-main
      queue: max
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and push version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git tag --points-at "$GITHUB_SHA" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "This commit already has a package version tag; skipping."
            exit 0
          fi

          branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)][0].head.ref // ""')
          latest=$(git tag --list \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | sort -V \
            | tail -n 1 || true)
          module_path=$(awk '$1 == "module" { print $2; exit }' go.mod)
          version=$(bash ci/next-version.sh "$branch" "$latest" "$module_path")

          git tag "$version" "$GITHUB_SHA"
          git push origin "$version"
