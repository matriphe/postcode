name: Go CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./...

  docker-smoke:
    name: BusyBox smoke test
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build BusyBox smoke image
        run: docker build --pull -f ci/Dockerfile -t postcode-ci .

      - name: Run golden cases in BusyBox
        run: docker run --rm postcode-ci
